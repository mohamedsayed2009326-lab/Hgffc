name: Build Android APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEY_AVAILABLE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Allow Android backup
        run: |
          if ! grep -q 'android:allowBackup=' android/app/src/main/AndroidManifest.xml; then
            sed -i 's/<application/<application android:allowBackup="true"/' android/app/src/main/AndroidManifest.xml
          fi
      - name: Configure release signing (optional secrets)
        if: env.RELEASE_KEY_AVAILABLE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
      - name: Build APK
        env:
          HAS_RELEASE_KEY: ${{ env.RELEASE_KEY_AVAILABLE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$HAS_RELEASE_KEY" = "true" ]; then
            cat >> android/app/build.gradle <<'GRADLE'
            android {
              signingConfigs { release { storeFile file('release.keystore'); storePassword System.getenv('STORE_PASSWORD'); keyAlias System.getenv('KEY_ALIAS'); keyPassword System.getenv('KEY_PASSWORD') } }
              buildTypes { release { signingConfig signingConfigs.release } }
            }
            GRADLE
            cd android && ./gradlew assembleRelease
          else
            cd android && ./gradlew assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: plates-manager-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v') && env.RELEASE_KEY_AVAILABLE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
